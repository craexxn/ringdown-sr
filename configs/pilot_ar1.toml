# Stationärer AR(1)-Kontrollfall mit bekannter Modellkovarianz.
schema_version = 1

[sampling]
n_samples = 128
sample_rate_hz = 4096.0

[signal]
amplitude = 1.0
frequency_hz = 250.0
decay_time_s = 0.008
phase_rad = 0.0

[noise]
kind = "gaussian_ar1"
standard_deviation = 0.1
bit_generator = "PCG64"
seed = 42
correlation = 0.65

[fit]
weighting = "known_covariance"
frequency_bounds_hz = [100.0, 500.0]
decay_time_bounds_s = [0.002, 0.03]
initial_points = [[150.0, 0.004], [300.0, 0.015], [450.0, 0.004]]
max_nfev = 1000

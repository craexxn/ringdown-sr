# Weißer Kontrollfall: drei freie SR-Arme und gemeinsame klassische Referenzen.
schema_version = 3

[sampling]
n_samples = 128
sample_rate_hz = 4096.0

[signal]
amplitude = 1.0
frequency_hz = 250.0
decay_time_s = 0.008
phase_rad = 0.0

[noise]
kind = "gaussian_white"
standard_deviation = 0.1
bit_generator = "PCG64"
seed = 42

[fit]
weighting = "compare_covariances"
frequency_bounds_hz = [100.0, 500.0]
decay_time_bounds_s = [0.002, 0.03]
initial_points = [[150.0, 0.004], [300.0, 0.015], [450.0, 0.004]]
max_nfev = 1000

[background]
n_train = 64
n_validation = 128
n_check = 256
bit_generator = "PCG64"
seed = 20261019
stream_scheme = "seedsequence_role_v1"

[covariance_estimation]
mean_mode = "known_zero"
alpha_candidates = [0.0, 0.001, 0.01, 0.05, 0.1, 0.2, 0.5, 1.0]
kappa_max = 1e8

[symbolic_search]
seed = 20261020
niterations = 10
populations = 2
population_size = 32
ncycles_per_iteration = 50

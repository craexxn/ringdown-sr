name: Isolated CI scheduler proof

on:
  push:
    branches: [codex/parallel-ci-scheduler-proof]
permissions:
  contents: read
concurrency:
  group: isolated-ci-scheduler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run actual scope command with isolated fixture
        id: scope
        env:
          PROOF_CASE: full
        run: python3 scripts/ci_scheduler_proof.py scope
      - name: Check documentation
        run: python3 scripts/check_ci.py docs
      - name: Record whether full setup would run
        if: steps.scope.outputs.full != 'false'
        run: echo full-setup-selected
  full-native-a:
    needs: full-prepare
    if: needs.full-prepare.outputs.full != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo native-control-success
  full-native-b:
    needs: full-prepare
    if: needs.full-prepare.outputs.full != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo native-control-success
  full-native-c:
    needs: full-prepare
    if: needs.full-prepare.outputs.full != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo native-control-success
  full-technical-checks:
    needs: [full-prepare, full-native-a, full-native-b, full-native-c]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run unchanged production gate on actual scheduler results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_CANCELLED: ${{ cancelled() }}
          PROOF_CASE: full
        run: python3 scripts/ci_scheduler_proof.py gate
  docs-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}

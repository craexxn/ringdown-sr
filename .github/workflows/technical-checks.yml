name: Technical checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12.14"
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  JULIA_NUM_PRECOMPILE_TASKS: "2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      full: ${{ steps.scope.outputs.full }}
      mode: ${{ steps.scope.outputs.mode }}
      comparison_known: ${{ steps.scope.outputs.comparison_known }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record tested commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Select CI coverage
        id: scope
        run: python3 scripts/check_ci.py scope

      - name: Check documentation
        run: python3 scripts/check_ci.py docs

      - name: Prepare historical Git references
        if: steps.scope.outputs.full != 'false'
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci.py history

      - name: Install uv
        if: steps.scope.outputs.full != 'false'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Install locked Python environment
        if: steps.scope.outputs.full != 'false'
        run: uv sync --locked --dev

      - name: Check Python code
        if: steps.scope.outputs.full != 'false'
        run: uv run --locked ruff check .

      - name: Check formatting
        if: steps.scope.outputs.full != 'false'
        run: uv run --locked ruff format --check .

      - name: Run unit tests
        if: steps.scope.outputs.full != 'false'
        run: uv run --locked pytest -q

  native:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record tested commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Prepare historical Git references
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci.py history

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Install locked Python environment
        run: uv sync --locked --dev

      - name: Check Python and Julia environment
        run: uv run --locked python scripts/run_python.py scripts/check_environment.py

      - name: Check repeated and concurrent Julia startup
        run: uv run --locked python scripts/check_julia_startup.py

      - name: Check Julia loss, constant optimization and Python replay
        run: uv run --locked python scripts/run_python.py scripts/check_julia_loss.py

      - name: Check paired schema-3 symbolic pilots and independent metrics
        run: uv run --locked python scripts/check_symbolic_pilot.py --output results/ci-sr-controls

      - name: Check fixed-structure diagnostic controls and passive instrumentation
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/run_python.py scripts/check_constant_diagnostic.py
          --output results/ci-constant-technical.json

      - name: Verify fixed near-zero losses and equivalent ringdown forms
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/run_python.py scripts/check_duration_replay.py
          --output results/ci-duration-replay.json

      - name: Verify bounded predictions and all fixed duration-003 trees
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/run_python.py scripts/check_prediction_reference.py
          --output results/ci-prediction-reference.json

      - name: Verify search budgets with five isolated tiny workers
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_search_duration_integration.py \
            --output results/ci-search-duration-technical; then
            if [ -d results/ci-search-duration-technical ]; then
              find results/ci-search-duration-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Probe fixed trees and actual optimizer paths in fresh workers
        run: >-
          env -u OPENBLAS_CORETYPE
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/probe_symbolic_numerics.py
          results/ci-sr-controls/white/symbolic/ordinary --label ci
          --output results/ci-fixed-numerics

      - name: Verify common Haswell BLAS core in fresh fixed-tree workers
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/probe_symbolic_numerics.py
          results/ci-sr-controls/white/symbolic/ordinary --label ci-haswell
          --require-openblas-core Haswell --output results/ci-fixed-numerics-haswell

      - name: Export parameters from the existing schema-3 controls
        run: |
          uv run --locked python scripts/export_parameter_diagnostics.py results/ci-sr-controls/white --output results/ci-parameters-white
          uv run --locked python scripts/export_parameter_diagnostics.py results/ci-sr-controls/ar1 --output results/ci-parameters-ar1

      - name: Check read-only diagnostic export and comparison
        run: |
          uv run --locked python scripts/diagnose_symbolic_pilot.py export results/ci-sr-controls --label ci --output results/ci-diagnostics
          uv run --locked python scripts/diagnose_symbolic_pilot.py compare results/ci-diagnostics results/ci-diagnostics --output results/ci-diagnostics-comparison.json

      - name: Verify common BLAS core before and after two actual free searches
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/repeat_symbolic_arm.py
          results/ci-sr-controls/white/symbolic/ordinary --label ci-haswell
          --require-openblas-core Haswell --output results/ci-free-search-haswell

      - name: Verify passive search observation and fresh off-on-off workers
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_search_trajectory_integration.py \
            --output results/ci-trajectory-technical; then
            if [ -d results/ci-trajectory-technical ]; then
              find results/ci-trajectory-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Check isolated free PySR searches and expression replay
        run: uv run --locked python scripts/run_python.py scripts/check_symbolic_search.py

      - name: Verify representation profiles, fixed references and tiny technical workers
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/check_representation_integration.py
          --output results/ci-representation-technical

      - name: Verify free optimizer budgets, fixed references and tiny A-B-A workers
        run: >-
          env OPENBLAS_CORETYPE=Haswell
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          uv run --locked python scripts/check_free_optimizer_integration.py
          --output results/ci-free-optimizer-technical

      - name: Verify trig grammar, native counterexamples and tiny K-A-K workers
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_trigonometric_grammar_integration.py \
            --output results/ci-trigonometric-grammar-technical; then
            if [ -d results/ci-trigonometric-grammar-technical ]; then
              find results/ci-trigonometric-grammar-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Verify local optimizer native guards and five tiny workers
        run: |
          env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/run_python.py scripts/check_local_optimizer_native.py
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_local_optimizer_integration.py \
            --output results/ci-local-optimizer-technical; then
            if [ -d results/ci-local-optimizer-technical ]; then
              find results/ci-local-optimizer-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Verify fixed 300-5 profile across five tiny outer-budget workers
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_outer_search_ladder_integration.py \
            --output results/ci-outer-search-ladder-technical; then
            if [ -d results/ci-outer-search-ladder-technical ]; then
              find results/ci-outer-search-ladder-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Verify signal input switching and fresh repeated control
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_transfer_check_integration.py \
            --output results/ci-transfer-check-technical; then
            if [ -d results/ci-transfer-check-technical ]; then
              find results/ci-transfer-check-technical -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

      - name: Compare two historical workers on the tiny fixed crossover control
        run: |
          if ! env OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 \
            uv run --locked python scripts/check_seed_driver_crosscheck.py \
            --output results/ci-seed-driver-crosscheck; then
            if [ -d results/ci-seed-driver-crosscheck ]; then
              find results/ci-seed-driver-crosscheck -type f -name '*.log' -print -exec tail -n 100 {} \;
            fi
            exit 1
          fi

  technical-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-technical-checks' || 'technical-checks' }}
    needs: [prepare, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record tested commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

      - name: Require complete CI coverage
        if: ${{ !cancelled() }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci.py gate
